        --t2: 209 213 219;
        --t3: 156 163 175;
        --ac: 99 102 241;
        --act: 165 180 252;
        --acm: 99 102 241;
        --ok: 110 231 183;
        --bad: 252 165 165;
        --warn: 252 211 77;
        --info: 125 211 252;
        --vio: 196 181 253;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --s0: 242 242 247;
        --s1: 255 255 255;
        --s2: 245 245 247;
        --s3: 255 255 255;
        --s4: 236 236 240;
        --bd: 217 217 224;
        --bdl: 199 199 208;
        --t1: 29 29 31;
        --t2: 44 44 48;
        --t3: 88 88 94;
        --ac: 79 70 229;
        --act: 67 56 202;
        --acm: 79 70 229;
        --ok: 6 95 70;
        --bad: 153 27 27;
        --warn: 120 53 15;
        --info: 3 105 161;
        --vio: 91 33 182;
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) {
          color-scheme: light;
          --s0: 242 242 247;
          --s1: 255 255 255;
          --s2: 245 245 247;
          --s3: 255 255 255;
          --s4: 236 236 240;
          --bd: 217 217 224;
          --bdl: 199 199 208;
          --t1: 29 29 31;
          --t2: 44 44 48;
          --t3: 88 88 94;
          --ac: 79 70 229;
          --act: 67 56 202;
          --acm: 79 70 229;
          --ok: 6 95 70;
          --bad: 153 27 27;
          --warn: 120 53 15;
          --info: 3 105 161;
          --vio: 91 33 182;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        overflow-x: hidden;
      }
      body {
        background: rgb(var(--s1));
        color: rgb(var(--t2));
        font:

          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      a {
        color: rgb(var(--act));
      }
      :focus-visible {
        outline: 2px solid rgb(var(--act));
        outline-offset: 2px;
        border-radius: 4px;
      }
      .app {
        display: flex;
        min-height: 100vh;
      }
      .side {
        width: 200px;
        flex: none;
        background: rgb(var(--s2));
        border-right: 1px solid rgb(var(--bd));
        padding: 16px 12px;
      }
      .brand {
        font-weight: 600;
        color: rgb(var(--t1));
        margin: 0 8px 16px;
      }
      .side a {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 8px;
        color: rgb(var(--t3));
        text-decoration: none;
        font-size: 13px;
      }
      .side a[aria-current] {
        background: rgb(var(--acm) / 0.15);
        color: rgb(var(--act));
      }
      .side a:hover {
        background: rgb(var(--s4));
      }
      .dot {
        background: rgb(var(--ac));
        color: #fff;
        border-radius: 99px;
        font-size: 11px;
        padding: 0 6px;
        min-width: 18px;
        text-align: center;
      }
      main {
        flex: 1;
        min-width: 0;
        padding: 24px 20px;
        max-width: 980px;
        margin: 0 auto;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        color: rgb(var(--t1));
        margin: 0 0 12px;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 16px;
      }
      .bar .grow {
        flex: 1;
        min-width: 160px;
      }
      select,
      input,
      button {
        font: inherit;
        color: rgb(var(--t1));
        background: rgb(var(--s3));
        border: 1px solid rgb(var(--bd));
        border-radius: 8px;
        padding: 6px 10px;
      }
      input {
        width: 100%;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        background: rgb(var(--s4));
      }
      .menu {
        position: relative;
      }
      .menu ul {
        position: absolute;
        right: 0;
        top: calc(100% + 4px);
        z-index: 5;
        margin: 0;
        padding: 4px;
        list-style: none;
        background: rgb(var(--s3));
        border: 1px solid rgb(var(--bdl));
        border-radius: 8px;
        min-width: 160px;
      }
      .menu li button {
        width: 100%;
        text-align: left;
        border: 0;
        background: none;
      }
      .menu li button:hover {
        background: rgb(var(--s4));
      }
      [hidden] {
        display: none !important;
      }
      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid rgb(var(--bd));
        overflow-x: auto;
        scrollbar-width: thin;
        margin-bottom: 16px;
      }
      .tabs [role="tab"] {
        border: 0;
        border-bottom: 2px solid transparent;
        border-radius: 0;
        background: none;
        color: rgb(var(--t3));
        padding: 8px 12px;
        white-space: nowrap;
        flex: none;
      }
      .tabs [role="tab"][aria-selected="true"] {
        color: rgb(var(--t1));
        border-bottom-color: rgb(var(--ac));
      }
      .cnt {
        background: rgb(var(--s4));
        border-radius: 99px;
        font-size: 11px;
        padding: 0 6px;
        margin-left: 4px;
        color: rgb(var(--t2));
      }
      .card {
        background: rgb(var(--s3));
        border: 1px solid rgb(var(--bd));
        border-radius: 12px;
      }
      .row {
        padding: 14px 18px;
        border-bottom: 1px solid rgb(var(--bd));
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row.cancelled {
        opacity: 0.72;
      }
      .top {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: baseline;
      }
      .q {
        color: rgb(var(--t1));
        font-weight: 500;
        overflow-wrap: anywhere;
        flex: 1 1 280px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border-radius: 6px;
        padding: 1px 8px;
        font-size: 11px;
        background: rgb(var(--s4));
        color: rgb(var(--t2));
        border: 1px solid rgb(var(--bd));
        white-space: nowrap;
      }
      .chip.ok {
        color: rgb(var(--ok));
        border-color: rgb(var(--ok) / 0.35);
        background: rgb(var(--ok) / 0.1);
      }
      .chip.bad {
        color: rgb(var(--bad));
        border-color: rgb(var(--bad) / 0.35);
        background: rgb(var(--bad) / 0.1);
      }
      .chip.warn {
        color: rgb(var(--warn));
        border-color: rgb(var(--warn) / 0.35);
        background: rgb(var(--warn) / 0.1);
      }
      .chip.info {
        color: rgb(var(--info));
        border-color: rgb(var(--info) / 0.35);
        background: rgb(var(--info) / 0.1);
      }
      .chip.vio {
        color: rgb(var(--vio));
        border-color: rgb(var(--vio) / 0.35);
        background: rgb(var(--vio) / 0.1);
      }
      .chip.hd {
        color: rgb(var(--act));
        border-color: rgb(var(--ac) / 0.35);
        background: rgb(var(--acm) / 0.12);
      }
      .opts {
        list-style: none;
        margin: 10px 0 0;
        padding: 0;
        display: grid;
        gap: 6px;
      }
      .opt {
        border: 1px solid rgb(var(--bd));
        border-radius: 8px;
        padding: 6px 10px;
        background: rgb(var(--s2));
      }
      .opt.sel {
        border-color: rgb(var(--ac));
        background: rgb(var(--acm) / 0.12);
      }
      .opt b {
        font-weight: 500;
        color: rgb(var(--t1));
      }
      .opt small {
        display: block;
        color: rgb(var(--t3));
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .more {
        margin-top: 6px;
        font-size: 12px;
        padding: 2px 8px;
      }
      blockquote {
        margin: 10px 0 0;
        padding: 6px 12px;
        border-left: 3px solid rgb(var(--ac));
        background: rgb(var(--s2));
        border-radius: 0 8px 8px 0;
        color: rgb(var(--t1));
        overflow-wrap: anywhere;
      }
      blockquote span,
      .lbl {
        display: block;
        font-size: 11px;
        color: rgb(var(--t3));
        text-transform: uppercase;
        letter-spacing: 0.06em;

        font-size: 13px;

        flex-wrap: wrap;

        font-size: 12px;
        color: rgb(var(--t3));

        gap: 6px;
        margin-bottom: 12px;

        color: rgb(var(--act));
      }
      .empty {

        text-align: center;
        color: rgb(var(--t3));
      }
      .pl {
        width: 100%;
        text-align: left;
        background: none;
        border: 0;
        border-radius: 0;
        padding: 0;
        display: block;
        color: inherit;
      }
      .pl:hover {
        background: none;
      }

        margin: 0;
        font-size: 14px;
        color: rgb(var(--t1));
        font-weight: 500;
      }
      .pl p {
        margin: 4px 0 0;
        font-size: 13px;
        color: rgb(var(--t3));
        overflow-wrap: anywhere;
      }

        margin-top: 12px;
        padding: 12px 14px;
        background: rgb(var(--s2));
        border-radius: 8px;
        border: 1px solid rgb(var(--bd));

        color: rgb(var(--t1));
        margin: 12px 0 4px;
        font-size: 15px;
      }
      .md h1:first-child {
        margin-top: 0;
      }
      .md p {
        margin: 6px 0;
      }
      .md ul {
        margin: 6px 0;
        padding-left: 20px;
      }
      .md code {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 12px;
        background: rgb(var(--s4));
        padding: 0 4px;
        border-radius: 4px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: rgb(var(--t3));
        text-align: left;
        font-weight: 500;
      }
      th,
      td {
        padding: 10px 14px;
        border-bottom: 1px solid rgb(var(--bd));
        vertical-align: top;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      td.p {
        overflow-wrap: anywhere;
      }
      .gone {
        text-decoration: line-through;
        color: rgb(var(--t3));
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        background: rgb(var(--s4));
        color: rgb(var(--t1));
        border: 1px solid rgb(var(--bdl));
        padding: 8px 14px;
        border-radius: 8px;
        z-index: 9;
        max-width: 90vw;
      }
      @media (max-width: 760px) {
        .side {
          display: none;
        }
        main {
          padding: 16px;
        }
        table,
        thead,
        tbody,
        tr,
        td {
          display: block;
        }
        thead {
          position: absolute;
          left: -9999px;
        }
        tr {
          padding: 10px 14px;
          border-bottom: 1px solid rgb(var(--bd));
        }
        td {
          border: 0;
          padding: 2px 0;
        }
      }

      const KC = { spec: "info", taslak: "vio", kanvas: "ok", görsel: "warn" };
      function drow(x) {
        return `<tr><td class="p mono ${x.missing ? "gone" : ""}">${esc(x.path)}${x.missing ? ' <span class="chip warn">silinmiş</span>' : ""}</td><td><span class="chip ${KC[x.kind]}">${esc(x.kind)}</span>${x.kind === "taslak" && !x.missing ? ' <a href="#">Aç</a>' : ""}</td><td>${sess(x.sessionId)}</td><td>${fmt(x.writtenAt)}</td></tr>`;
      }
      const empty = (a, b) =>
        `<div class="empty">${needle ? "Aramaya uyan kayıt yok. Aramayı temizleyin ya da başka bir sözcük deneyin." : a}</div>`;
      function body(name) {
        if (name === "Bekleyen") {
          const l = pending();
          return `<div class="card">${l.length ? l.map((d) => qrow(d, 1)).join("") : empty("Cevap bekleyen soru yok. Ajanlar soru sorduğunda burada görünür.")}</div><p class="hint">Claude Code oturumundaki soru kokpitten cevaplanamaz; oturuma geçip cevaplayın.</p>`;
        }
        if (name === "Kararlar") {
          const l = asks()
            .filter(
              (d) => status === "Hepsi" || (status === "Cevaplandı") === (d.status === "resolved")
            )
            .sort((a, b) => (b.askedAt || "").localeCompare(a.askedAt || ""));
          return `<div class="filters" role="group" aria-label="Durum süzgeci">${["Hepsi", "Cevaplandı", "Terk edildi"].map((s) => `<button data-st="${s}" aria-pressed="${s === status}">${s}</button>`).join("")}</div><div class="card">${l.length ? l.map((d) => qrow(d)).join("") : empty("Bu süzgeçte karar yok. Başka bir durum seçin.")}</div>`;
        }
        if (name === "Planlar") {
          const l = plans();
          return `<div class="card">${l.length ? l.map(prow).join("") : empty("Henüz onaylanan ya da reddedilen plan yok.")}</div>`;
        }
        const l = DATA.designs.filter((x) => (x.path + x.kind).toLowerCase().includes(needle));
        return `<div class="card">${l.length ? `<table><thead><tr><th>Yol</th><th>Tür</th><th>Yazan oturum</th><th>Tarih</th></tr></thead><tbody>${l.map(drow).join("")}</tbody></table>` : empty("Bu projede tasarım dosyası bulunmuyor.")}</div>`;
      }
      const TABS = ["Bekleyen", "Kararlar", "Planlar", "Tasarımlar"];
      const counts = () => ({
        Bekleyen: pending().length,
        Kararlar: asks().length,
        Planlar: plans().length,
        Tasarımlar: DATA.designs.length,
      });
      function render() {
        const c = counts();
        $("#navCnt").textContent = DATA.decisions.filter((d) => d.status === "pending").length;
        $("#tabs").innerHTML = TABS.map(
          (t, i) =>
            `<button role="tab" id="t${i}" aria-controls="p${i}" aria-selected="${t === tab}" tabindex="${t === tab ? 0 : -1}">${t}<span class="cnt">${c[t]}</span></button>`
        ).join("");
        $("#panels").innerHTML = TABS.map(
          (t, i) =>
            `<div role="tabpanel" id="p${i}" aria-labelledby="t${i}" ${t === tab ? "" : "hidden"}>${t === tab ? body(t) : ""}</div>`
        ).join("");
      }
      function toast(m) {
        const t = $("#toast");
        t.textContent = m;
        t.hidden = false;
        clearTimeout(toast.h);
        toast.h = setTimeout(() => (t.hidden = true), 2200);
      }
      $("#tabs").addEventListener("click", (e) => {
        const b = e.target.closest("[role=tab]");
        if (b) {
          tab = TABS[+b.id.slice(1)];
          render();
        }
      });
      $("#tabs").addEventListener("keydown", (e) => {
        const i = TABS.indexOf(tab),
          n = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: 3 }[e.key];
        if (n === undefined) return;
        e.preventDefault();
        tab = TABS[(n + 4) % 4];
        render();
        $("#t" + TABS.indexOf(tab)).focus();
      });
      $("#panels").addEventListener("click", (e) => {
        const m = e.target.closest("[data-more]"),
          s = e.target.closest("[data-st]"),
          p = e.target.closest("[data-plan]");
        if (m) expanded.add(m.dataset.more);
        else if (s) status = s.dataset.st;
        else if (p) {
          const k = p.dataset.plan;
          openPlans.has(k) ? openPlans.delete(k) : openPlans.add(k);
        } else return;
        render();
      });
      $("#q").addEventListener("input", (e) => {
        needle = e.target.value.trim().toLowerCase();
        render();
      });
      $("#proj").addEventListener("change", (e) => {
        if (e.target.value !== "ai-cockpit")
          toast("Bu projede henüz karar yok (taslakta örnek yok)");
      });
      $("#exp").addEventListener("click", () => {
        const o = $("#expm").hidden;
        $("#expm").hidden = !o;
        $("#exp").setAttribute("aria-expanded", o);
      });
      $("#expm").addEventListener("click", (e) => {
        const b = e.target.closest("[data-f]");
        if (!b) return;
        $("#expm").hidden = true;
        $("#exp").setAttribute("aria-expanded", false);
        toast("Dışa aktarım (" + b.dataset.f + ") taslakta indirilmez");
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          $("#expm").hidden = true;
          $("#exp").setAttribute("aria-expanded", false);
        }
      });
      const root = document.documentElement;
      const setTheme = (t) => {
        root.dataset.theme = t;
        $("#theme").textContent = "Tema: " + (t === "light" ? "açık" : "koyu");
      };
      setTheme(matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      $("#theme").addEventListener("click", () =>
        setTheme(root.dataset.theme === "light" ? "dark" : "light")
      );
      render();
    </script>
  </body>
</html>
